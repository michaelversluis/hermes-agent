name: hermes-watt
repo: https://github.com/michaelversluis/hermes-watt
sha: "ead82379e6329e8c55c279665c6e09481234a18f"
description: >-
  Local task energy receipts and quality-checked workflow comparisons. Opt-in Apple CPU/GPU estimates are system-wide;
  cloud energy stays unknown. Stores hashed task IDs, model labels, request counts and estimates locally in the active
  profile; no prompt/response storage, uploads, secrets, runtime network calls or background service. The optional
  zeus-apple-silicon 1.1.0 native dependency reads IOReport in-process on Apple Silicon. The separate, manually run
  development benchmark sends synthetic tickets only to a loopback model server and writes local evidence.
maintainer: michaelversluis
tier: community
category: desktop
requires_hermes: ">=0.23.0"
docs_url: https://github.com/michaelversluis/hermes-watt/blob/ead82379e6329e8c55c279665c6e09481234a18f/README.md
