readme: true
platforms: []
title: "Hermes Watt"
known_issues:
  - "Energy telemetry is currently Apple Silicon only; other hosts show unknown energy and still record request metadata."
  - "Native Desktop interactive QA is pending; SDK validation and component render tests pass. Evidence video is a labelled replay."
