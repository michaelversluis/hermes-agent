readme: true
platforms: []
title: "Hermes Watt"
known_issues:
  - "Energy telemetry is currently Apple Silicon only; other hosts show unknown energy and still record request metadata."
  - "Native Desktop visual QA is pending; SDK validation, component interaction tests and actual Hermes-host integration pass. The evidence video is a labelled data replay."
  - "Comparisons require a separately started local model. Only fixed fictional workloads are supported; results are not general or cloud savings claims."
